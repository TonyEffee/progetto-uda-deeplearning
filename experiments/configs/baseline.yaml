experiment_name: baseline_resnet18

data:
  source_dir: data/source
  target_dir: data/target
  batch_size: 32
  num_workers: 4 # su Windows, se hai errori di multiprocessing, abbassa a 0

model:
  num_classes: 6 # buildings, forest, glacier, mountain, sea, street

training:
  epochs: 15
  lr: 0.0003
  weight_decay: 0.0001
  optimizer: adam
  seed: 42

output:
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  checkpoint_name: baseline_resnet18_best.pth
